syntax = "proto3";

package dev.ikm.tinkar.service;

import "Tinkar.proto";

option java_multiple_files = true;
option java_package = "dev.ikm.tinkar.service.proto";
option java_outer_classname = "IkeAdminProto";

/*
 * Tier 3: Admin / Data Management
 *
 * Operations for importing changesets, exporting entity data,
 * and running the reasoner classification pipeline.
 * Target audience: platform operators, DevOps, CI/CD pipelines.
 */

// ── Import / Export jobs ────────────────────────────────────────────
//
// Imports and exports run on the server as jobs, one at a time and in order behind the reasoner
// and each other. A job belongs to the server, not to the call that asked for it: a call that ends
// early only stops watching, and WatchJob picks the job up again.

// One message of an ImportChangeset upload: exactly one start, then the file in chunks.
message ImportChangesetChunk {
  oneof part {
    ImportChangesetStart start = 1;
    // The next bytes of the ZIP file, in order. Keep each under the message size limit;
    // 1 MiB is a good size.
    bytes data = 2;
  }
}

message ImportChangesetStart {
  // What to call the import in job listings, usually the file's name.
  string file_name = 1;
  /*
   * If true, import in a single pass, which fails on forward references in a store whose nids
   * encode the pattern. False (the default) reads the file as many times as the store needs.
   */
  bool single_pass = 2;
}

// Summary of entity counts from an import or export.
message EntityCountSummaryProto {
  int64 concepts_count = 1;
  int64 semantics_count = 2;
  int64 patterns_count = 3;
  int64 stamps_count = 4;
  int64 total_count = 5;
}

// Export type selection.
enum ExportType {
  FULL = 0;       // Export all entities (default)
  TEMPORAL = 1;   // Export entities modified within a time range — Komet's "Change set"
  MEMBERSHIP = 2; // Export entities matching membership tags
}

message ExportEntitiesRequest {
  // Type of export to perform. Default: FULL.
  ExportType export_type = 1;
  // For TEMPORAL export: start time as epoch milliseconds (inclusive).
  int64 from_epoch_millis = 2;
  // For TEMPORAL export: end time as epoch milliseconds (inclusive).
  int64 to_epoch_millis = 3;
  // For MEMBERSHIP export: list of tag PublicIds.
  repeated dev.ikm.tinkar.schema.PublicId membership_tags = 4;
}

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  REASONER = 1;
  IMPORT = 2;
  EXPORT = 3;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  SUCCEEDED = 3;
  FAILED = 4;
  CANCELLED = 5;
}

message JobInfo {
  string job_id = 1;
  JobKind kind = 2;
  string label = 3;
  JobState state = 4;
  // Epoch milliseconds.
  int64 queued_at = 5;
  // Epoch milliseconds; 0 until the job starts.
  int64 started_at = 6;
}

message JobProgress {
  int64 done = 1;
  // 0 or 1 with done negative while the total is not known.
  int64 total = 2;
  string message = 3;
}

message JobResult {
  string job_id = 1;
  bool success = 2;
  // True if the job was cancelled — exports and reasoner runs only; imports cannot be.
  bool cancelled = 3;
  string error_message = 4;
  EntityCountSummaryProto entity_counts = 5;
  int64 duration_ms = 6;
  // Export: the file's name and size; its bytes arrive as file_chunk events before this result.
  string file_name = 7;
  int64 file_size_bytes = 8;
}

message JobQueuePosition {
  // The jobs ahead of this one, the running one first. Empty once it is next.
  repeated JobInfo ahead = 1;
}

/*
 * One message of a job stream, in order: job, then queued while it waits, started, progress as it
 * runs, then — for an export that succeeded — the file as file_chunk events, then exactly one
 * result. A failure arrives as a result with success=false, not as a stream error.
 */
message JobEvent {
  oneof event {
    // First: the job this stream follows.
    JobInfo job = 1;
    JobQueuePosition queued = 2;
    // Epoch milliseconds.
    int64 started_at = 3;
    JobProgress progress = 4;
    JobResult result = 5;
    // Export only: the next bytes of the exported ZIP, in order.
    bytes file_chunk = 6;
  }
}

message WatchJobRequest {
  string job_id = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

// Empty: the call succeeding is the answer. See CancelJob.
message CancelJobResponse {
}

// ── Reasoner ────────────────────────────────────────────────────────

message RunReasonerRequest {
  // Currently no parameters needed — uses server defaults.
  // Future: could accept coordinate overrides, specific reasoner name, etc.
}

// Summary of classification results. Every count is derivable from the sets in
// RunReasonerResult, but kept so a caller that only wants a summary need not
// receive the sets.
message ReasonerResultsProto {
  int32 classified_concept_count = 1;
  int32 inferred_changes_count = 2;
  int32 navigation_changes_count = 3;
  int32 equivalent_sets_count = 4;
  int32 cycles_count = 5;
  int32 orphans_count = 6;
}

/*
 * One equivalence class. A wrapper message is required because protobuf has no
 * repeated-of-repeated.
 */
message EquivalentSet {
  repeated dev.ikm.tinkar.schema.PublicId concept = 1;
}

/*
 * Progress for one completed phase of the pipeline.
 *
 * step and total_steps mirror Komet's local RunReasonerTaskBase, which reports
 * four phases through a TrackingCallable. Keeping the numbering and the message
 * text identical means the same progress UI can be driven by a local run or a
 * remote one without the two diverging in what the user sees.
 */
message ReasonerPhase {
  int32 step = 1;
  int32 total_steps = 2;
  string message = 3;
}

/*
 * Terminal event of the stream, carrying what Komet's reasoner results panel
 * reads out of ClassifierResults.
 *
 * Concepts are PublicIds, not nids: nids are assigned per data store, so the
 * server's are meaningless to a client. The client resolves each PublicId
 * against its own store.
 */
message RunReasonerResult {
  bool success = 1;
  string error_message = 2;
  ReasonerResultsProto counts = 3;
  int64 duration_ms = 4;
  int64 created_at = 5;

  /*
   * Field 6 was classification_concept_set. Removed deliberately, not deferred:
   * Komet's results panel calls size() on it and then disables and collapses the
   * pane, so the concepts are never displayed. Sending them cost 20.5 MB on the
   * gudidsubset dataset (511,681 concepts) and put the response 5x over gRPC's
   * default 4 MB limit, to populate a number that classified_concept_count in
   * ReasonerResultsProto already carries.
   */
  reserved 6;
  reserved "classification_concept_set";

  repeated dev.ikm.tinkar.schema.PublicId concepts_with_inferred_changes = 7;
  repeated dev.ikm.tinkar.schema.PublicId concepts_with_navigation_changes = 8;
  repeated dev.ikm.tinkar.schema.PublicId orphans = 9;
  repeated EquivalentSet equivalent_sets = 10;

  /*
   * When the server committed the inferred results. Functionally required, not
   * informational: the results panel pushes this onto the view coordinate so
   * the client's view advances far enough to see what was just written.
   */
  int64 commit_time = 11;

  /*
   * The server's view coordinate, pre-rendered. The panel only ever displays
   * these as text, so sending the strings avoids serialising an entire
   * ViewCoordinateRecord that would be reassembled only to call toUserString().
   */
  string stamp_coordinate_text = 12;
  string logic_coordinate_text = 13;
  string edit_coordinate_text = 14;

  /*
   * True when the run was stopped by CancelReasoner before it wrote anything.
   * success is false and error_message empty: not a success, but not a
   * failure either. A cancel that arrives once writing has begun lets the
   * write finish, and the run reports success.
   */
  bool cancelled = 15;
}

/*
 * First event on every RunReasoner and WatchReasoner stream: which run the
 * caller is now watching.
 *
 * A run belongs to the server, not to the call that started it, so a caller
 * may join one already in progress, or one that has already ended. This says
 * which, so the client can say "reconnected to a run started at ..." rather
 * than implying it just started one.
 */
message ReasonerRunInfo {
  // When the run started, in epoch milliseconds.
  int64 started_at = 1;
  // True if this call started the run; false if it joined one running or finished.
  bool started = 2;
}

/*
 * One message in a RunReasoner or WatchReasoner stream: first the run, then
 * each phase as it completes (replayed from the start when joining a run
 * already under way), then exactly one result. A failure arrives as a result
 * with success=false rather than as a stream error, so the caller reads the
 * reason from the same place either way.
 */
message RunReasonerEvent {
  oneof event {
    ReasonerPhase phase = 1;
    RunReasonerResult result = 2;
    ReasonerRunInfo run = 3;
  }
}

message WatchReasonerRequest {
}

message CancelReasonerRequest {
}

// Empty: the call succeeding is the answer. See CancelReasoner.
message CancelReasonerResponse {
}

// ── Service ─────────────────────────────────────────────────────────

service IkeAdmin {
  /*
   * Import a changeset (protobuf ZIP file). The client sends one start then the file in chunks,
   * and half-closes; the server queues the import and streams its job events back. Imports cannot
   * be cancelled — stopped part way they would leave some entities written — so ending this call
   * only stops watching.
   */
  rpc ImportChangeset(stream ImportChangesetChunk) returns (stream JobEvent);

  /*
   * Export entities. Queues the export and streams its job events; on success the ZIP follows as
   * file_chunk events, then the result. Ending the call early only stops watching, and the file is
   * then not sent: CancelJob stops the export itself.
   */
  rpc ExportEntities(ExportEntitiesRequest) returns (stream JobEvent);

  /*
   * Rejoin any import or export job by id, replaying what it has done so far. Never sends an
   * export's file. Fails with NOT_FOUND for an unknown or expired job (jobs are kept an hour).
   */
  rpc WatchJob(WatchJobRequest) returns (stream JobEvent);

  /*
   * Ask a queued or running export or reasoner run to stop. Fails with NOT_FOUND for an unknown
   * job, and FAILED_PRECONDITION if it has finished or is an import.
   */
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  /*
   * Run the full reasoner classification pipeline, streaming progress.
   *
   * Server-streaming rather than unary because a full classification is slow
   * and a unary call leaves the caller with no signal until it finishes. The
   * pipeline itself is a single stateful run on one ReasonerService instance,
   * so it is NOT exposed as one RPC per phase — that would require the server
   * to hold a reasoner session between calls.
   *
   * The run belongs to the server, not to this call. If a run is already
   * going, the call joins it instead of starting a second. Ending the call —
   * cancelling it, a dropped connection, closing the client — only stops
   * watching; the classification carries on. Stop it with CancelReasoner.
   */
  rpc RunReasoner(RunReasonerRequest) returns (stream RunReasonerEvent);

  /*
   * Joins the running classification, or replays the most recent one if it
   * has finished, as the same stream RunReasoner returns. Never starts a run.
   * For getting back to a run after the client was closed.
   *
   * Fails with NOT_FOUND if there has been no run since the server started.
   */
  rpc WatchReasoner(WatchReasonerRequest) returns (stream RunReasonerEvent);

  /*
   * Asks the running classification to stop, and returns at once. Everyone
   * watching the run gets a result with cancelled=true once it has stopped.
   *
   * Fails with FAILED_PRECONDITION if no classification is running.
   */
  rpc CancelReasoner(CancelReasonerRequest) returns (CancelReasonerResponse);
}
