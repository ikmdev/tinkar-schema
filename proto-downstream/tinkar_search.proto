// DEPRECATED: This service is maintained for backward compatibility only and is
// scheduled for removal. New clients should use:
//   - ike_graph_rag.proto       (Tier 1: IkeGraphRAG service)
//   - ike_knowledge_graph.proto (Tier 2: IkeKnowledgeGraph service)
//
// Its message contracts now live in ike_types.proto, which the tiered services
// share. Nothing but the service definition below remains here, so removing this
// file removes only the deprecated surface.

syntax = "proto3";

package dev.ikm.tinkar.service;

import "ike_types.proto";

option java_multiple_files = true;
option java_package = "dev.ikm.tinkar.service.proto";
option java_outer_classname = "TinkarSearchProto";

// gRPC service definition
service TinkarSearchService {
  rpc Search(TinkarSearchQueryRequest) returns (TinkarSearchQueryResponse);
  rpc ConceptSearch(TinkarConceptSearchRequest) returns (TinkarSearchQueryResponse);
  rpc ConceptSearchWithSort(TinkarConceptSearchWithSortRequest) returns (TinkarConceptSearchWithSortResponse);
  rpc GetEntity(TinkarConceptIdRequest) returns (TinkarSearchQueryResponse);
  rpc GetChildConcepts(TinkarConceptIdRequest) returns (TinkarSearchQueryResponse);
  rpc GetDescendantConcepts(TinkarConceptIdRequest) returns (TinkarSearchQueryResponse);
  rpc GetLIDRRecordConceptsFromTestKit(TinkarConceptIdRequest) returns (TinkarSearchQueryResponse);
  rpc GetResultConformanceConceptsFromLIDRRecord(TinkarConceptIdRequest) returns (TinkarSearchQueryResponse);
  rpc GetAllowedResultConceptsFromResultConformance(TinkarConceptIdRequest) returns (TinkarSearchQueryResponse);
  rpc RebuildSearchIndex(TinkarRebuildIndexRequest) returns (TinkarRebuildIndexResponse);
  rpc InspectConcept(TinkarConceptIdRequest) returns (TinkarConceptSemanticsResponse);
  /*
   * Returns the field values, pattern name, and STAMP info for a single semantic instance,
   * fetched by the semantic's own public ID (e.g. a Test Performed record, a comment, an
   * identifier) — as opposed to InspectConcept, which lists all semantics attached to a
   * concept but cannot be addressed by a semantic's own ID.
   */
  rpc GetSemanticInfo(TinkarConceptIdRequest) returns (TinkarSemanticInfoResponse);
  /*
   * Returns the full entity graph for a concept (concept + semantics + patterns + stamps)
   * so the caller can load them into a local entity store and display the concept detail view.
   */
  rpc LoadConceptEntityGraph(TinkarConceptIdRequest) returns (TinkarConceptEntityResponse);
  /*
   * Returns a single entity (plus its version stamps) for the given public ID.
   * Used by GrpcPrimitiveDataService as a fallback when an entity is not in the local cache.
   */
  rpc GetEntityByPublicId(TinkarConceptIdRequest) returns (TinkarConceptEntityResponse);
}
